name: Keep Demo Warm

# Best-effort pinger for the free-tier Render demo services so recruiters don't
# hit a 60-170s cold start when they open the live demo.
#
# This workflow must NEVER report a repo-level failure. It is a warmer, not a
# health assertion. A slow Render cold start legitimately exceeds the request
# timeout and returns HTTP 000, and the backend answers 403 on unauthenticated
# paths because Spring Security guards every route. Both still wake the service,
# which is the entire point. Measured while warm: backend /actuator/health -> 200
# in 0.76s, AI service /api/health/live -> 200 in 0.1s. The services are healthy;
# only the cold start is slow.
#
# NOTE (honest tradeoff): keeping services warm 24/7 consumes Render's free
# instance-hours (~750/mo, shared across services) and will exhaust them before
# month-end. During an active job hunt the real fix is the $7/mo Render paid
# tier for the backend, or linking a 90-second Loom instead of the raw URL.
# Tune the cron interval or disable this workflow as needed.

on:
  schedule:
    # Budget-aware window. Render free tier gives 750 instance-hours/month across
    # ALL free services. Warming 2 services 24/7 costs ~1,440 h/month, which
    # exhausted the quota on 2026-08-16 and suspended the AI service until 01 Sep
    # (symptom: HTTP 503 with x-render-routing: hibernate-wake-error).
    #
    # 12h/day x 2 services x 30 days = 720 h/month, just inside the 750 cap.
    # 04:00-15:59 UTC = 09:30-21:29 IST: covers Indian recruiter hours plus the
    # US morning overlap. Outside the window the demo cold-starts (~60-170s),
    # which is the deliberate trade for not blacking out mid-month.
    - cron: '*/10 4-15 * * *'
  workflow_dispatch:          # run manually to warm the demo before an interview/application

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm backend
        continue-on-error: true
        run: |
          curl --silent --show-error --max-time 240 --retry 2 --retry-all-errors \
            -o /dev/null -w "backend: HTTP %{http_code} in %{time_total}s\n" \
            https://ai-court-g20y.onrender.com/actuator/health

      # Must always run: the AI service has the slowest cold start, so it has to
      # be pinged even when the backend step timed out or errored. Previously a
      # backend failure aborted the job and left the slowest service unwarmed.
      - name: Warm AI service
        if: always()
        continue-on-error: true
        run: |
          curl --silent --show-error --max-time 240 --retry 2 --retry-all-errors \
            -o /dev/null -w "ai: HTTP %{http_code} in %{time_total}s\n" \
            https://ai-court-ai.onrender.com/api/health/live
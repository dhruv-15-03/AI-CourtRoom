server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the same asset types the backend already compresses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html;
    gzip_min_length 1024;

    # React Router client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets CRA produces under /static.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
